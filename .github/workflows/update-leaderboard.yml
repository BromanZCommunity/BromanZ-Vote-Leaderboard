name: Update Vote Leaderboards

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules are best-effort and can occasionally skip or delay a run.
    # Two attempts per hour keep the Discord leaderboard reliably up to date.
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: bromanZ-vote-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Update Discord vote leaderboards
        env:
          TOP_GAMES_TOKEN: ${{ secrets.TOP_GAMES_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LEADERBOARD_PAGE_SIZE: ${{ vars.LEADERBOARD_PAGE_SIZE || '50' }}
        run: python vote_leaderboard.py

      - name: Save leaderboard state and monthly history
        if: ${{ always() }}
        run: |
          if git diff --quiet -- data/; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "BromanZ Vote Leaderboard"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Update vote leaderboard state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
